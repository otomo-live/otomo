# Site settings for the otomo documentation (services/wiki, design/16-wiki-service.md).
# Built from this directory; served at /docs/. Pages not listed here are still
# built and searchable. Every page here is for teams using otomo; design documents
# for people changing otomo itself live in design/, outside this site.
site_name: Otomo Documentation
site_description: Deploy otomo on your own VM and connect your Godot game to it.
