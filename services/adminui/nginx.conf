# The server block for the bundled SPA, not a whole nginx.conf.
#
# It is copied to /etc/nginx/conf.d/adminui.conf, where the base image's own
# nginx.conf includes it from inside its http block. That is deliberate: the
# non-root settings that make nginxinc/nginx-unprivileged work (its `user`, its
# pid and temp paths under /tmp) live in that nginx.conf, and replacing the file
# wholesale would have to reproduce every one of them correctly to keep the
# container booting as an unprivileged user. A conf.d drop-in inherits them.
#
# The base image's own conf.d/default.conf is deleted in the dockerfile. It
# listens on 8080 as well, so leaving it would mean two server blocks answering
# the same port and, depending on which one nginx picks as the default server,
# the admin UI or the nginx welcome page.

server {
    # 8080, not 80: the image runs as a non-root user and cannot bind a
    # privileged port. It also means this service needs no container-port
    # parameter anywhere: ci/services/Jenkinsfile maps ${PORT}:8080 for every
    # service, and the port map in ci/dispatcher/Jenkinsfile is therefore only
    # about host ports.
    listen 8080 default_server;
    listen [::]:8080 default_server;

    # No useful server_name. Every request arrives through gateway_dev carrying
    # whatever host the staff browser used, and the gateway forwards the Host
    # header unchanged, so a name here would only route some of them to a
    # different block.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    # The nginx version in an error page or a Server header is free
    # reconnaissance on a host that is reachable from the admin network.
    server_tokens off;

    # Bundles here are a few hundred kB of JavaScript and benefit from being
    # compressed on the wire. The directive is on in this block rather than in
    # the base nginx.conf because gzip_types alone does nothing when gzip is off,
    # and it is off in the base image.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # CSP, frame-ancestors, nosniff, Referrer-Policy. Repeated in every location
    # below that sets its own add_header, because those drop the server-level
    # ones; see the comment at the top of security-headers.conf.
    include /etc/nginx/adminui-security-headers.conf;

    # The SPA fallback, under /admin/ rather than at the root.
    #
    # gateway_dev does not strip this prefix (internal/router/dev.go sets no
    # StripPrefix, and internal/proxy/proxy.go only rewrites a path when the
    # prefix is non-empty), so what nginx receives is /admin/... and that is what
    # gets served. WEB-6's literal `try_files $uri /index.html` is the form for
    # an app at the origin root; here that fallback is written as
    # /admin/index.html, and Vite's `base` is the matching '/admin/'.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Vite writes content-hashed filenames into assets/, so the name changes
    # whenever the content does and a year of caching is safe. `immutable` tells
    # the browser not to revalidate even on an explicit reload.
    #
    # Only add_header, with no `expires`: `expires 1y` emits a Cache-Control of
    # its own, and the response would then carry two of them.
    location /admin/assets/ {
        include /etc/nginx/adminui-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The two files whose names do NOT change between builds, which is exactly
    # why they are the two that must not be cached.
    #
    # index.html references the hashed asset names, so a cached copy is how a
    # staff browser ends up running the previous deployment; env.json is the
    # runtime configuration a deployment is allowed to overwrite in place
    # (WEB-2, "one image everywhere"), so a cached copy is how that override gets
    # ignored. Both are revalidated on every load and cost nothing when unchanged
    # (a 304).
    #
    # The try_files fallback above redirects internally to /admin/index.html,
    # which re-runs location matching and lands here, so deep links get the
    # no-cache header too.
    location = /admin/index.html {
        include /etc/nginx/adminui-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /admin/env.json {
        include /etc/nginx/adminui-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # A bare /admin is a prefix, not a directory, to the browser: without the
    # trailing slash it resolves every relative URL against the parent of the
    # app's own directory. Redirect rather than serve, so it cannot happen.
    location = /admin {
        return 301 /admin/;
    }

    # Nothing serves the origin root. The UI is under /admin/ and every API path
    # is a gateway_dev route, so a 404 here is the honest answer to a request
    # that could only be a mistake, and it stops the app being reachable at two
    # URLs, only one of which the bundle was built for.
    location = / {
        return 404;
    }
}
