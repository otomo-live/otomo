# Security headers for every response the admin UI serves (UI-15).
#
# A separate file because of how add_header inherits: a location that declares
# any add_header of its own (the Cache-Control ones in nginx.conf) drops every
# add_header from the server level. nginx.conf therefore includes this file once
# at the server level and again in each of those locations; the policy test in
# tests/unit/nginx-headers.spec.ts fails if a location sets a header without it.
#
# `always` so 404s and redirects carry them too.
#
# The CSP, directive by directive:
# - script-src 'self': the built index.html has no inline script, only the hashed
#   module bundles under /admin/assets/.
# - style-src 'self' 'unsafe-inline': Ionic's components and CodeMirror
#   (style-mod) inject <style> elements at runtime. Inline styles cannot run
#   code, and script-src stays strict, which is what the CSP is for.
# - img-src data: the TOTP enrollment QR code is a PNG data URL, and Ionic's
#   built-in icons are inline SVG data URLs. blob: for previews of chosen files.
# - connect-src 'self': the API is same-origin through gateway_dev (env.json
#   apiBaseUrl is ""). A deployment that points apiBaseUrl at another origin has
#   to add it here.
# - frame-ancestors 'none' (and X-Frame-Options for older browsers): no page may
#   frame the admin UI, which is what makes clickjacking the sign-in or the
#   publish buttons impossible.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# same-origin: API calls keep their Referer (same origin), nothing leaks to a
# link out of the app. The onboarding token lives in the URL fragment, which is
# never part of a Referer anyway.
add_header Referrer-Policy "same-origin" always;
