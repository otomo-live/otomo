# otomo wiki runtime: a full nginx.conf for nginxinc/nginx-unprivileged:1.27-alpine.
#
# This file is a TEMPLATE. The image build renders it with
#     envsubst '${BASE_PATH}' < nginx.conf > /etc/nginx/nginx.conf
# so only ${BASE_PATH} is substituted and nginx's own $variables ($uri, $host,
# $remote_addr, ...) are left untouched.
#
# The build places the MkDocs output at /usr/share/nginx/html${BASE_PATH}, so
# the whole site is served under BASE_PATH and a 404 under the base path falls
# back to ${BASE_PATH}404.html.
#
# Security posture: no cookies, no external requests, strict CSP, no Server
# version. See design/16-wiki-service.md.

worker_processes auto;
# The image runs as an unprivileged user, so every writable path is under /tmp.
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # One JSON object per request, on stdout for the container log.
    log_format json_combined escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"request":"$request",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"referer":"$http_referer",'
          '"user_agent":"$http_user_agent",'
          '"request_time":$request_time'
        '}';
    access_log /dev/stdout json_combined;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    server_tokens     off;
    absolute_redirect off;

    server {
        listen      8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # --- security headers -------------------------------------------------
        # No cookie is ever set: the wiki has no session and no tracking.
        #
        # nginx does not inherit add_header once a location defines one, so the
        # three headers below are repeated in the locations that add their own
        # Cache-Control.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # A 404 anywhere under BASE_PATH serves the site's own page, which
        # MkDocs writes to /usr/share/nginx/html${BASE_PATH}404.html.
        error_page 404 ${BASE_PATH}404.html;

        # Content-addressed framework assets: cache for seven days.
        location ${BASE_PATH}assets/ {
            try_files $uri =404;

            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "public, max-age=604800" always;
        }

        # Pages and everything else: always revalidate.
        location / {
            try_files $uri $uri/ =404;

            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache" always;
        }
    }
}
