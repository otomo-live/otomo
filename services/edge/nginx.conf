# Process-wide settings. The per-site config is rendered by edge-render into
# /etc/nginx/conf.d/edge.conf: TLS mode once a certificate exists, bootstrap mode
# (ACME challenges only) before that.
worker_processes auto;
# Each proxied connection holds two descriptors (client and upstream).
worker_rlimit_nofile 16384;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # One JSON line per request, like every otomo service. No cookies or
    # Authorization values: neither is logged, and cookies never pass the edge.
    log_format edge_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration_s":$request_time,'
        '"upstream":"$upstream_addr","upstream_s":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout edge_json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # Docker's embedded DNS. Upstreams are resolved per request (they are set
    # through variables), so the edge starts and keeps serving even when a
    # wiki container is not up yet; that route answers 502 until it is.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
