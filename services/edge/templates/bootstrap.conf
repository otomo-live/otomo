# Bootstrap mode: no certificate yet. Port 80 answers Let's Encrypt's HTTP-01
# challenges from the webroot the host's certbot writes into, and nothing else.
# Player traffic is never served over plain HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "TLS is not provisioned on this host yet.\n";
    }
}
