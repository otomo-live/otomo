# TLS mode. Rendered by edge-render with EDGE_SERVER_NAME,
# EDGE_GATEWAY_URL, EDGE_DOCS_URL and the site block substituted.

# Plain HTTP: ACME challenges (renewals use this path too) and a redirect.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://${EDGE_SERVER_NAME}$request_uri;
    }
}

# Any TLS client asking for a name we do not serve gets no certificate at all.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${EDGE_SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${EDGE_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${EDGE_SERVER_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:edge_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS for this host only. Never includeSubDomains or preload: the parent
    # domain is shared with every other team, and this host has no subdomains.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No cookies cross the public edge, in either direction. If the host sits under
    # a shared parent domain, browsers send us other sites' parent-domain
    # cookies; nothing public here uses cookies, so none are forwarded and no
    # upstream can ever set one (design/06 §13.2).
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;

    # The gateway trusts X-Forwarded-For only from this container's fixed
    # address (GATEWAY_TRUSTED_PROXIES), and reads the rightmost entry, so the
    # header is overwritten with exactly the client address, never appended to.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    client_max_body_size 1m;
    proxy_connect_timeout 5s;

    # --- player API: the gateway's three public prefixes --------------------
    location /auth/ {
        set $gateway ${EDGE_GATEWAY_URL};
        proxy_pass $gateway;
    }

    # Pack downloads are large and slow: stream them, and allow long reads.
    location /patch/ {
        set $gateway ${EDGE_GATEWAY_URL};
        proxy_pass $gateway;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The events long-poll holds for 25 s; the gateway allows 35 s.
    location /api/player/ {
        set $gateway ${EDGE_GATEWAY_URL};
        proxy_pass $gateway;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # --- the technical wiki -------------------------------------------------
    location = /docs {
        return 301 /docs/;
    }

    # Forwarded unchanged: the wiki image serves the site under /docs/ itself
    # (BASE_PATH), so its own redirects keep the prefix.
    location /docs/ {
        set $docs ${EDGE_DOCS_URL};
        proxy_pass $docs;
    }

    # --- everything else: the optional site at the root ---------------------
${EDGE_SITE_BLOCK}
}
